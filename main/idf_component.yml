dependencies:
  idf: ">=5.5,<6.0"
  # Pinned: the dynamic apps share LVGL's structures with the firmware and the
  # simulator (the AmoledOS lesson), so LVGL moves for all three at once.
  lvgl/lvgl:
    version: "==9.5.0"
    public: true
  waveshare/esp32_p4_wifi6_touch_lcd_5:
    version: "^1.0.4"
    public: true
  waveshare/esp_lcd_hx8394:
    version: "^2.1.0"
    public: true
  # Wi-Fi through the ESP32-C6. esp_hosted 3.x on the P4 still talks to the
  # C6's factory firmware (docs/migration.md upstream), and brings the SDIO
  # fixes of 2.x and the co-processor OTA.
  espressif/esp_wifi_remote: ">=1.6"
  espressif/esp_hosted: "~3.0.9"
  espressif/mdns: "*"
  # pictures (aos_image_p4.c): big JPEGs scaled while decoding, and PNG
  espressif/esp_new_jpeg: "^1.0.2"
  espressif/libpng: "^1.6"
  # AAC and HE-AAC for the radio (aos_aac_esp.c), the watch's: a prebuilt
  # library under Espressif's modified MIT licence, for Espressif chips only
  espressif/esp_audio_codec: ">=2.4.0,<2.6.0"   # 2.6+ refuses ESP32-P4 below rev 3.0, and this board is rev 1.3
  # H.264 for the Cameras app (aos_h264.c): tinyh264, the software decoder
  # AmoledOS measured on the watch; constrained baseline only
  espressif/esp_h264: "^1.4.1"
  # DSP for the apps (aos_symbols.c lends a chosen part of it): on the P4 a
  # float multiply-add costs ~5 cycles whatever the code, and esp-dsp's
  # 16-bit routines run on the core's SIMD (PIE) at under one a tap. The RF
  # app's filters are its first user (apps/rf/main/rf_demod.c).
  espressif/esp-dsp: "^1.6"
