dependencies:
  # The Macro pad's keyboard and mouse on the OTG port (aos_usb_p4.c): TinyUSB
  # through Espressif's wrapper, the same one the S3 watch uses.
  espressif/esp_tinyusb: "^2.0.0"
  # HOST mode (aos_usb_p4.c): a pendrive on the header's USB lines, J3 pins
  # 25/27 with 5 V from pin 1 (the OTG connector gives no 5 V), mounted at
  # /usb through FATFS
  espressif/usb_host_msc: "^1.1.3"
  # USB serial on the host (aos_usb_serial_p4.c): CDC-ACM devices (Arduinos,
  # boards with native USB) and the CH34x, CP210x and FTDI converters, as
  # ports "usb0", "usb1" of the Terminal (aos_io)
  espressif/usb_host_cdc_acm: "^2.4.1"
  espressif/usb_host_ch34x_vcp: "^2.2.1"
  espressif/usb_host_cp210x_vcp: "^2.2.0"
  espressif/usb_host_ftdi_vcp: "^2.1.1"
  # webcams on the host (aos_usb_uvc_p4.c): MJPEG frames, decoded by the P4's
  # JPEG engine
  espressif/usb_host_uvc: "^2.6.0"
  # USB sound cards on the host (aos_usb_uac_p4.c): the speaker's output,
  # sent to the card instead of the board's speaker
  espressif/usb_host_uac: "^1.5.0"
