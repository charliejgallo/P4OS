# Copies the art packs and SmartIR's library (build.yml, CARRIED_PACKS) from
# the latest published release into another one, on GitHub's side: for a
# release made before build.yml carried them over by itself, or one whose
# hand upload stalled.
#   gh workflow run attach-packs.yml -f tag=v0.13.0
name: attach-packs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: the release to complete (v0.13.0)
        required: true
      from:
        description: where to take them from (empty - the latest published release)
        required: false

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      CARRIED_PACKS: monsterhop_p4.pak turbo_p4.pak golf_p4.pak mila_p4.pak mila_p4.pak.1 mila_p4.pak.2 infrarrojo_p4.pak pinball_zombis_p4.pak pinball_robots_p4.pak pinball_jungla_p4.pak pinball_circo_p4.pak pinball_casino_p4.pak pinball_piratas_p4.pak bastion_p4.pak bastion_p4.pak.1 bastion_p4.pak.2 bastion_luna_p4.pak bastion_selva_p4.pak bastion_magma_p4.pak bastion_hielo_p4.pak bastion_orbita_p4.pak bastion_cristal_p4.pak bastion_cienaga_p4.pak bastion_nebula_p4.pak bastion_colmena_p4.pak bastion_nucleo_p4.pak mesa_p4.pak mesa_marmol_p4.pak mesa_vidrio_p4.pak mesa_metal_p4.pak metegol_p4.pak metegol_rio_p4.pak metegol_madrid_p4.pak metegol_munich_p4.pak metegol_londres_p4.pak metegol_mexico_p4.pak metegol_tokio_p4.pak metegol_avella_rojo_p4.pak metegol_avella_celeste_p4.pak sudoku_p4.pak vuelos_p4.pak hockey_p4.pak hockey_neon_p4.pak hockey_hielo_p4.pak oficina_p4.pak tanques_p4.pak tanques_luna.pak tanques_playa.pak tortuga_p4.pak
    steps:
      - name: copy
        run: |
          from="${{ inputs.from }}"
          [ -n "$from" ] || from=$(gh release view --repo "$R" --json tagName -q .tagName)
          echo "from $from into ${{ inputs.tag }}"
          mkdir -p packs
          for p in $CARRIED_PACKS; do
            gh release download "$from" --repo "$R" -p "$p" -D packs || echo "not in $from: $p"
          done
          ls -la packs
          gh release upload "${{ inputs.tag }}" --repo "$R" --clobber packs/*
