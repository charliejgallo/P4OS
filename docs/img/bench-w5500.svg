<text x="550.0" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">A W5500 Ethernet module on the 40-pin header</text>
<text x="550.0" y="64" text-anchor="middle" font-size="13" fill="#555">the W5500 Lite (HW-884) on spi.a with jumper wires: the bench before the auxiliary board</text>
