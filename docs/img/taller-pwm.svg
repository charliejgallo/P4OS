<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>PWM on the header: two LEDs, a servo and an analog level</title>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">PWM en el header de 40 pines</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#555">tres frecuencias a la vez (los tres timers libres del LEDC) y un nivel analógico (sigma-delta, aparte)</text>

  <!-- the header, pins 13 to 34 -->
  <rect x="300" y="78" width="80" height="320" rx="6" fill="#1f2937"/>
  <g fill="#e5e7eb" font-size="12">
    <!-- odd pins on the left, even on the right; rows 28 px apart from y=94 -->
    <g id="pins">
      <circle cx="322" cy="94" r="8" fill="#9ca3af"/><circle cx="358" cy="94" r="8" fill="#9ca3af"/>
      <circle cx="322" cy="122" r="8" fill="#9ca3af"/><circle cx="358" cy="122" r="8" fill="#f59e0b"/>
      <circle cx="322" cy="150" r="8" fill="#9ca3af"/><circle cx="358" cy="150" r="8" fill="#9ca3af"/>
      <circle cx="322" cy="178" r="8" fill="#9ca3af"/><circle cx="358" cy="178" r="8" fill="#f59e0b"/>
      <circle cx="322" cy="206" r="8" fill="#9ca3af"/><circle cx="358" cy="206" r="8" fill="#f59e0b"/>
      <circle cx="322" cy="234" r="8" fill="#9ca3af"/><circle cx="358" cy="234" r="8" fill="#9ca3af"/>
      <circle cx="322" cy="262" r="8" fill="#9ca3af"/><circle cx="358" cy="262" r="8" fill="#111827" stroke="#e5e7eb" stroke-width="2"/>
      <circle cx="322" cy="290" r="8" fill="#9ca3af"/><circle cx="358" cy="290" r="8" fill="#9ca3af"/>
      <circle cx="322" cy="318" r="8" fill="#9ca3af"/><circle cx="358" cy="318" r="8" fill="#9ca3af"/>
      <circle cx="322" cy="346" r="8" fill="#f59e0b"/><circle cx="358" cy="346" r="8" fill="#9ca3af"/>
      <circle cx="322" cy="374" r="8" fill="#111827" stroke="#e5e7eb" stroke-width="2"/><circle cx="358" cy="374" r="8" fill="#9ca3af"/>
    </g>
  </g>
  <text x="384" y="420" font-size="12" fill="#6b7280">pines 13 a 34 (el 1 y el 2, arriba)</text>

  <!-- the GND rail on the right, from pin 26 -->
  <g stroke="#111" stroke-width="2.5" fill="none">
    <path d="M366 262 H460 V262 H900"/>
    <path d="M900 110 V262"/>
  </g>
  <circle cx="900" cy="262" r="4" fill="#111"/>
  <text x="908" y="258" font-size="12" fill="#111">GND</text>

  <!-- LED 1 on GPIO28: 1 kHz -->
  <g stroke-width="2.5" fill="none">
    <path d="M366 122 H460" stroke="#b45309"/>
    <path d="M460 122 H560" stroke="#b45309"/>
    <path d="M630 122 H700" stroke="#b45309"/>
    <path d="M740 122 H900 V110" stroke="#111"/>
  </g>
  <rect x="560" y="112" width="70" height="20" rx="3" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="595" y="106" text-anchor="middle" font-size="12">330 Ω</text>
  <path d="M700 108 L700 136 L736 122 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M738 108 V136" stroke="#7f1d1d" stroke-width="3"/>
  <path d="M712 100 l10 -10 M722 104 l10 -10" stroke="#ef4444" stroke-width="2"/>
  <text x="778" y="114" font-size="12">LED 1</text>
  <text x="470" y="146" font-size="12" fill="#b45309">PWM 1 kHz</text>

  <!-- LED 2 on GPIO29: 5 kHz -->
  <g stroke-width="2.5" fill="none">
    <path d="M366 178 H560" stroke="#b45309"/>
    <path d="M630 178 H700" stroke="#b45309"/>
    <path d="M740 178 H900" stroke="#111"/>
  </g>
  <rect x="560" y="168" width="70" height="20" rx="3" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="595" y="162" text-anchor="middle" font-size="12">330 Ω</text>
  <path d="M700 164 L700 192 L736 178 Z" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
  <path d="M738 164 V192" stroke="#14532d" stroke-width="3"/>
  <text x="470" y="170" font-size="12" fill="#b45309">PWM 5 kHz</text>
  <text x="778" y="170" font-size="12">LED 2</text>
  <circle cx="900" cy="178" r="4" fill="#111"/>

  <!-- analog level on GPIO30: 1k + 1uF -->
  <g stroke-width="2.5" fill="none">
    <path d="M366 206 H560" stroke="#7c3aed"/>
    <path d="M630 206 H740" stroke="#7c3aed"/>
    <path d="M740 206 V222" stroke="#7c3aed"/>
    <path d="M740 240 V262" stroke="#111"/>
  </g>
  <rect x="560" y="196" width="70" height="20" rx="3" fill="#ddd6fe" stroke="#5b21b6" stroke-width="2"/>
  <text x="595" y="230" text-anchor="middle" font-size="12">1 kΩ</text>
  <path d="M724 223 H756 M724 239 H756" stroke="#5b21b6" stroke-width="3"/>
  <text x="764" y="236" font-size="12">1 µF</text>
  <circle cx="740" cy="206" r="4" fill="#7c3aed"/>
  <circle cx="740" cy="262" r="4" fill="#111"/>
  <path d="M740 206 L800 206" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="800" y="192" width="86" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="843" y="211" text-anchor="middle" font-size="12" fill="#5b21b6">tester: 0–3,3 V</text>
  <text x="470" y="226" font-size="12" fill="#7c3aed">sigma-delta</text>

  <!-- the servo on GPIO32 / GND 33, its own 5 V -->
  <g stroke-width="3" fill="none">
    <path d="M314 346 H260 V470 H150" stroke="#f97316"/>
    <path d="M314 374 H280 V490 H150" stroke="#78350f"/>
  </g>
  <rect x="40" y="440" width="110" height="80" rx="8" fill="#2563eb"/>
  <text x="95" y="476" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">Servo</text>
  <text x="95" y="496" text-anchor="middle" font-size="12" fill="#dbeafe">SG90, MG90...</text>
  <path d="M95 520 V560 H230" stroke="#dc2626" stroke-width="3" fill="none"/>
  <path d="M280 490 V545" stroke="#78350f" stroke-width="3" fill="none"/>
  <circle cx="280" cy="490" r="4" fill="#78350f"/>
  <rect x="230" y="545" width="150" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="305" y="566" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Fuente 5 V aparte</text>
  <text x="305" y="584" text-anchor="middle" font-size="11" fill="#991b1b">+ al rojo, − al GND común</text>
  <text x="40" y="404" font-size="12" fill="#c2410c">señal (naranja): PWM 50 Hz, al pin 31</text>
  <text x="40" y="422" font-size="12" fill="#78350f">GND (marrón): al pin 33 y a la fuente</text>
  <text x="40" y="618" font-size="11" fill="#6b7280">Sin fuente aparte: el 5 V del pin 1 o 3 sirve para un servo chico, con 470 µF entre 5 V y GND cerca del servo.</text>

  <!-- what it shows -->
  <rect x="520" y="440" width="440" height="160" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="540" y="466" font-size="14" font-weight="bold" fill="#111">Qué se prueba</text>
  <g font-size="12" fill="#374151">
    <text x="540" y="490">• LED 1 (GPIO28) a 1 kHz y LED 2 (GPIO29) a 5 kHz: dos timers</text>
    <text x="540" y="510">• Servo (GPIO32) a 50 Hz: el tercer timer, el último libre</text>
    <text x="540" y="530">• Nivel analógico (GPIO30): sigma-delta, no usa timer</text>
    <text x="540" y="550">• Un cuarto canal a otra frecuencia (GPIO31, sin cablear):</text>
    <text x="552" y="568">la app tiene que avisar que no hay timer libre</text>
    <text x="540" y="590" fill="#6b7280">LEDs: la pata larga (ánodo) hacia el resistor. El timer 1 es del brillo.</text>
  </g>
  <!-- labels -->
  <g font-size="12" fill="#374151" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <g text-anchor="end">
      <text x="296" y="98">13 GND</text><text x="296" y="126">15 GPIO21</text><text x="296" y="154">17 GPIO22</text>
      <text x="296" y="182">19 GND</text><text x="296" y="210">21 GPIO24</text><text x="296" y="238">23 GPIO25</text>
      <text x="296" y="266">25 USB</text><text x="296" y="294">27 USB</text><text x="296" y="322">29 GND</text>
      <text x="296" y="350" font-weight="bold" fill="#b45309">31 GPIO32</text><text x="296" y="378" font-weight="bold" fill="#111">33 GND</text>
    </g>
    <g>
      <text x="384" y="98">14 GPIO4</text><text x="384" y="126" font-weight="bold" fill="#b45309">16 GPIO28</text>
      <text x="384" y="154">18 3V3</text><text x="384" y="182" font-weight="bold" fill="#b45309">20 GPIO29</text>
      <text x="384" y="210" font-weight="bold" fill="#b45309">22 GPIO30</text><text x="384" y="238">24 GPIO31</text>
      <text x="384" y="266" font-weight="bold" fill="#111">26 GND</text><text x="384" y="294">28 GPIO34</text>
      <text x="384" y="322">30 BOOT</text><text x="384" y="350">32 GPIO49</text><text x="384" y="378">34 GPIO50</text>
    </g>
  </g>
</svg>
