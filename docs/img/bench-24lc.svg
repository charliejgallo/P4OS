<text x="58" y="739" font-size="14" font-weight="bold" fill="#111">Wiring a 24LC (24LC256 and its family; the EEPROM app draws each chip)</text>
<text x="58" y="761" font-size="12" fill="#374151">• SDA (chip pin 5) to GPIO21, header pin 15; SCL (chip pin 6) to GPIO22, header pin 17; a 4.7 kΩ pull-up from each to 3V3</text>
<text x="58" y="781" font-size="12" fill="#374151">• VCC (8) to 3V3 (header pin 18 or 2), VSS (4) to GND (pin 19); A0-A2 (1-3) to GND: address 0x50</text>
<text x="58" y="801" font-size="12" fill="#374151">• WP (7) to GND to write; to 3V3 it is read only. Never 5 V on the header</text>
<text x="58" y="821" font-size="12" fill="#374151">• Tags with the same name (3V3, GND) are the same wire. In the EEPROM app: I2C, port i2c.ext, address 0x50, Detect</text>
<rect x="500" y="158" width="80" height="528" rx="6" fill="#1f2937"/>
<text x="540" y="149" text-anchor="middle" font-size="11" fill="#6b7280">the header, as it faces you</text>
<text x="935.0" y="371.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">24LC256</text>
<text x="935.0" y="389.0" font-size="10" fill="#9ca3af" text-anchor="middle">top view, turned</text>
