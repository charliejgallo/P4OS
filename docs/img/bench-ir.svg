<rect x="40" y="735" width="1020" height="116" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="58" y="759" font-size="14" font-weight="bold" fill="#111">What it tries (all of it worked on the board, 2026-10-05)</text>
<text x="58" y="781" font-size="12" fill="#374151">• Learn: the receiver on GPIO5 (pin 11) read a monitor's remote: Samsung, address 0x0707, command 7 (volume up)</text>
<text x="58" y="801" font-size="12" fill="#374151">• Send: the LED on GPIO31 (pin 24) at 38 kHz turned the monitor's volume up, from the learned code and from SmartIR's library</text>
<text x="58" y="821" font-size="12" fill="#374151">• A header pin gives about 20 mA; through the transistor the LED takes ~70 mA from 5 V and reaches across a room</text>
<text x="58" y="841" font-size="12" fill="#374151">• Not GPIO21/22 for the receiver: they are the I2C bus the system scans by itself. The two 3V3 tags are one wire</text>
<rect x="500" y="158" width="80" height="528" rx="6" fill="#1f2937"/>
<text x="540" y="149" text-anchor="middle" font-size="11" fill="#6b7280">the header, as it faces you</text>
<text x="920" y="377" font-size="11" fill="#e5e7eb" text-anchor="middle">receiver</text>
