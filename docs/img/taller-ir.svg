<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Infrared on the header: a receiver and an IR LED through a transistor</title>
  <rect width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Infrarrojo en el header de 40 pines</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#555">un receptor que demodula (VS1838B, TSOP38238) y un LED IR con transistor</text>

  <!-- the header, pins 11 to 26 -->
  <rect x="300" y="78" width="80" height="236" rx="6" fill="#1f2937"/>
  <g>
    <circle cx="322" cy="94" r="8" fill="#f59e0b"/><circle cx="358" cy="94" r="8" fill="#9ca3af"/>
    <circle cx="322" cy="122" r="8" fill="#111827" stroke="#e5e7eb" stroke-width="2"/><circle cx="358" cy="122" r="8" fill="#9ca3af"/>
    <circle cx="322" cy="150" r="8" fill="#9ca3af"/><circle cx="358" cy="150" r="8" fill="#9ca3af"/>
    <circle cx="322" cy="178" r="8" fill="#9ca3af"/><circle cx="358" cy="178" r="8" fill="#dc2626"/>
    <circle cx="322" cy="206" r="8" fill="#9ca3af"/><circle cx="358" cy="206" r="8" fill="#9ca3af"/>
    <circle cx="322" cy="234" r="8" fill="#9ca3af"/><circle cx="358" cy="234" r="8" fill="#9ca3af"/>
    <circle cx="322" cy="262" r="8" fill="#9ca3af"/><circle cx="358" cy="262" r="8" fill="#f59e0b"/>
    <circle cx="322" cy="290" r="8" fill="#9ca3af"/><circle cx="358" cy="290" r="8" fill="#111827" stroke="#e5e7eb" stroke-width="2"/>
  </g>

  <!-- the receiver on the left: OUT to GPIO21 (pin 15), GND pin 13, VCC 3V3 pin 18 -->
  <g stroke-width="2.5" fill="none">
    <path d="M314 94 H240 V122 H200" stroke="#b45309"/>
    <path d="M314 122 H252 V150 H200" stroke="#111"/>
    <path d="M366 178 H430 V66 H170 V100" stroke="#dc2626"/>
  </g>
  <rect x="70" y="100" width="130" height="80" rx="10" fill="#111827"/>
  <circle cx="135" cy="128" r="18" fill="#374151"/>
  <text x="135" y="168" text-anchor="middle" font-size="12" fill="#e5e7eb">receptor</text>
  <g font-size="11" fill="#111">
    <text x="204" y="117">OUT</text><text x="204" y="145">GND</text><text x="176" y="94">VCC</text>
  </g>

  <!-- the sender on the right: GPIO31 (pin 24) -> 1k -> base; emitter GND pin 26; collector -> LED cathode; LED anode -> 47R -> 5 V -->
  <g stroke-width="2.5" fill="none">
    <path d="M366 262 H520 V234 H560" stroke="#b45309"/>
    <path d="M630 234 H690" stroke="#b45309"/>
    <path d="M366 290 H740 V300" stroke="#111"/>
  </g>
  <rect x="560" y="224" width="70" height="20" rx="3" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="595" y="216" text-anchor="middle" font-size="12">1 kΩ</text>
  <!-- NPN -->
  <circle cx="730" cy="234" r="34" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <path d="M708 214 V254" stroke="#111" stroke-width="3"/>
  <path d="M690 234 H708" stroke="#b45309" stroke-width="2.5"/>
  <path d="M708 224 L740 202 V180" stroke="#111" stroke-width="2.5" fill="none"/>
  <path d="M708 244 L740 266 V300" stroke="#111" stroke-width="2.5" fill="none"/>
  <path d="M732 260 L742 268 L729 270 Z" fill="#111"/>
  <text x="776" y="238" font-size="12">NPN (2N2222, BC547)</text>
  <text x="746" y="196" font-size="11">C</text><text x="746" y="292" font-size="11">E</text><text x="684" y="226" font-size="11">B</text>
  <circle cx="740" cy="300" r="4" fill="#111"/>
  <text x="752" y="318" font-size="12">E a GND (pin 26)</text>
  <!-- LED IR and its resistor up to 5 V -->
  <path d="M740 180 V160" stroke="#111" stroke-width="2.5"/>
  <path d="M726 160 L754 160 L740 132 Z" fill="#7c3aed" stroke="#4c1d95" stroke-width="2" transform="rotate(180 740 146)"/>
  <path d="M726 132 H754" stroke="#4c1d95" stroke-width="3"/>
  <path d="M760 128 l12 -10 M766 138 l12 -10" stroke="#7c3aed" stroke-width="2"/>
  <text x="782" y="150" font-size="12">LED IR (940 nm): la pata larga arriba</text>
  <path d="M740 132 V120" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="730" y="70" width="20" height="50" rx="3" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="760" y="100" font-size="12">47 Ω</text>
  <path d="M740 70 V50 H900" stroke="#dc2626" stroke-width="2.5" fill="none"/>
  <text x="904" y="54" font-size="12" fill="#b91c1c">5 V (pin 1 o 3)</text>

  <!-- labels on top, with a white halo -->
  <g font-size="12" fill="#374151" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <g text-anchor="end">
      <text x="296" y="98" font-weight="bold" fill="#b45309">11 GPIO5</text><text x="296" y="126" font-weight="bold" fill="#111">13 GND</text>
      <text x="296" y="154">15 GPIO21</text><text x="296" y="182">17 GPIO22</text><text x="296" y="210">19 GND</text>
      <text x="296" y="238">21 GPIO24</text><text x="296" y="266">23 GPIO25</text><text x="296" y="294">25 USB</text>
    </g>
    <g>
      <text x="384" y="98">12 GPIO3</text><text x="384" y="126">14 GPIO4</text><text x="384" y="154">16 GPIO28</text>
      <text x="384" y="182" font-weight="bold" fill="#b91c1c">18 3V3</text><text x="384" y="210">20 GPIO29</text>
      <text x="384" y="238">22 GPIO30</text><text x="384" y="266" font-weight="bold" fill="#b45309">24 GPIO31</text>
      <text x="384" y="294" font-weight="bold" fill="#111">26 GND</text>
    </g>
  </g>
  <text x="340" y="332" text-anchor="middle" font-size="12" fill="#6b7280">pines 11 a 26</text>

  <rect x="40" y="350" width="920" height="196" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="378" font-size="14" font-weight="bold" fill="#111">Qué se prueba</text>
  <g font-size="12" fill="#374151">
    <text x="60" y="402">• Aprender: el receptor en GPIO5 (pin 11) lee un botón del control de la tele o del aire: marcas y espacios en µs, y el protocolo si es conocido.</text>
    <text x="60" y="424">• Mandar: el LED en GPIO31 (pin 24) a 38 kHz. A simple vista no se ve; con la cámara del celular sí (titila violeta).</text>
    <text x="60" y="446">• Ida y vuelta en la mesa: el LED apuntando al receptor, lo que se manda vuelve a entrar.</text>
    <text x="60" y="468">• El transistor: un pin del header da ~20 mA; un LED IR con 47 Ω a 5 V toma ~70 mA y llega más lejos. Sin transistor, el LED</text>
    <text x="72" y="486">directo al pin con 100 Ω y a GND sirve para probar de cerca.</text>
    <text x="60" y="508">• El receptor: un VS1838B visto de frente es OUT, GND, VCC (otros modelos cambian el orden). VCC a 3,3 V (pin 18), nunca a 5 V.</text>
    <text x="60" y="532" fill="#6b7280">Lo de PWM (pines 16, 20, 22 y 31) puede quedar armado. GPIO21/22 no: son del bus I2C externo, que el sistema revisa solo.</text>
  </g>
</svg>
