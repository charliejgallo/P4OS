<rect x="40" y="715" width="1020" height="116" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="58" y="739" font-size="14" font-weight="bold" fill="#111">What it tries (it worked on the board, 2026-10-05)</text>
<text x="58" y="761" font-size="12" fill="#374151">• The data on GPIO4 (pin 14) through 330 Ω near the strip; 5 V from pin 1 (or 3), GND from pin 10</text>
<text x="58" y="781" font-size="12" fill="#374151">• In LED Strips: GPIO4, WS2812B, GRB, 12 LEDs, a 500 mA budget (12 LEDs at full white would take ~720 mA)</text>
<text x="58" y="801" font-size="12" fill="#374151">• Colours in the right order, effects at 50 fps, and back by itself after a restart</text>
<text x="58" y="821" font-size="12" fill="#374151">• 3.3 V data was enough with short wires; if LEDs flicker at random, a level shifter (74AHCT125)</text>
