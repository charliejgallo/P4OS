<text x="760" y="557" font-size="12" fill="#374151" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">signal (orange): PWM 50 Hz</text>
<text x="760" y="611" font-size="12" fill="#374151" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">GND (brown), shared by the servo and its supply</text>
<rect x="40" y="715" width="1120" height="116" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="58" y="739" font-size="14" font-weight="bold" fill="#111">What it tries (all of it worked on the board, 2026-10-05)</text>
<text x="58" y="761" font-size="12" fill="#374151">• LED 1 (GPIO28, pin 16) at 1 kHz and LED 2 (GPIO29, pin 20) at 5 kHz: two LEDC timers. LEDs: the long leg (anode) toward the resistor</text>
<text x="58" y="781" font-size="12" fill="#374151">• The servo (GPIO32, pin 31) at 50 Hz, 500-2500 µs: the third timer, the last one free (LEDC timer 1 is the screen's backlight)</text>
<text x="58" y="801" font-size="12" fill="#374151">• The analog level (GPIO30, pin 22): sigma-delta through 1 kΩ and 1 µF, no timer; 1.34 V asked, 1.313 V measured</text>
<text x="58" y="821" font-size="12" fill="#374151">• Without its own supply, a small servo can take 5 V from pin 1 or 3, with 470 µF across it near the servo</text>
<rect x="500" y="158" width="80" height="528" rx="6" fill="#1f2937"/>
<text x="540" y="149" text-anchor="middle" font-size="11" fill="#6b7280">the header, as it faces you</text>
